backend:
  name: git-gateway
  branch: main

site_url: https://class-9-academic-dashboard-chps.netlify.app
display_url: https://class-9-academic-dashboard-chps.netlify.app
media_folder: "images"

collections:
  - name: "notices"
    label: "Notice List"
    folder: "notices"
    create: true
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Details", name: "body", widget: "markdown"}
      
